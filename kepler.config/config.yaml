---
# -- Replaces the name of the chart in the Chart.yaml file
nameOverride: ""
# -- Replaces the generated name
fullnameOverride: ""

image:
  # -- Repository to pull the image from
  repository: "ghcr.io/casparwackerle/tycho-energy"
  # -- Image tag, if empty it will get it from the chart's appVersion
  tag: "latest"
  # -- Pull policy
  pullPolicy: Always

# -- Secret name for pulling images from private repository
imagePullSecrets: []

# -- Additional DaemonSet annotations
annotations: {}

# -- Additional pod annotations
podAnnotations: {}

# -- Additional pod labels
podLabels: {}

# -- Privileges and access control settings for a Pod (all containers in a pod)
podSecurityContext: {}
  # fsGroup: 2000

# -- Privileges and access control settings for a container
securityContext:
  privileged: true

# -- Node selection constraint
nodeSelector:
  kubernetes.io/os: linux

# -- Toleration for taints
tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane

# -- Affinity rules
affinity: {}

# -- CPU/MEM resources
resources: {}

# -- Extra environment variables
extraEnvVars:
  KEPLER_LOG_LEVEL: "5"           #reduce log level to 5 for finished builds
  # METRIC_PATH: "/metrics"
  # BIND_ADDRESS: "0.0.0.0:9102"
  ENABLE_GPU: "false"
  ENABLE_QAT: "false"
  ENABLE_EBPF_CGROUPID: "true"
  EXPOSE_HW_COUNTER_METRICS: "true"
  EXPOSE_IRQ_COUNTER_METRICS: "true"
  EXPOSE_CGROUP_METRICS: "true"
  ENABLE_PROCESS_METRICS: "true"
  CPU_ARCH_OVERRIDE: ""
  CGROUP_METRICS: '*'
  REDFISH_PROBE_INTERVAL_IN_SECONDS: "60"
  REDFISH_SKIP_SSL_VERIFY: "true"

  # Enable flags
  TYCHO_COLLECTOR_ENABLE_BPF: "true"
  TYCHO_COLLECTOR_ENABLE_RAPL: "false"
  TYCHO_COLLECTOR_ENABLE_GPU: "true"
  TYCHO_COLLECTOR_ENABLE_REDFISH: "false"

  # Measurement Periods (milliseconds)
  TYCHO_BPF_POLL_MS: "50"
  TYCHO_RAPL_POLL_MS: "150"
  TYCHO_GPU_POLL_MS: "200"
  TYCHO_REDFISH_POLL_MS: "8000" # Polling cadence (milliseconds). To catch every BMC publish, set this LOWER than the BMC’s actual cadence. If unknown, 1000 ms is a safe, low-overhead default for many servers.

  # Optional timing extras: Metric delay (i.e. the delay between a workload change and it's representation in the metric). Insert if known, otherwise keep at 0.
  TYCHO_TIMEBASE_QUANTUM_MS: "1"
  TYCHO_BPF_DELAY_MS: "0"
  TYCHO_RAPL_DELAY_MS: "0"
  TYCHO_GPU_DELAY_MS: "200"
  TYCHO_REDFISH_DELAY_MS: "0" 
  TYCHO_REDFISH_HEARTBEAT_MAX_GAP_MS: "3000" # Heartbeat timeout (milliseconds). Set to 150% of the known BMC publishing frequency, if known. Otherwise set to 15000 as a safe, conservative default.

  # CalibrationRaplPollMinMs
  TYCHO_CALIBRATION_IDLE_BUDGET_SEC: "10"                       # total time allowed for initial idle check
  TYCHO_CALIBRATION_RAPL_DELAY_ENABLE: "false"                   # enable RAPL delay calibration
  TYCHO_CALIBRATION_RAPL_DELAY_BUDGET_SEC: "30"                 # max duration for RAPL delay measurement
  TYCHO_CALIBRATION_RAPL_IDLE_ENABLE: "false"                    # measure RAPL idle baseline
  TYCHO_CALIBRATION_REDFISH_CONTINUOUS_HEARTBEAT_ENABLE: "false" # keep Redfish connection alive during calibration
  TYCHO_CALIBRATION_REDFISH_POLL_ENABLE: "false"                 # enable Redfish poll-rate calibration
  TYCHO_CALIBRATION_REDFISH_POLL_BUDGET_SEC: "30"               # max duration for Redfish poll-rate probe
  TYCHO_CALIBRATION_REDFISH_DELAY_ENABLE: "false"                # enable Redfish delay measurement
  TYCHO_CALIBRATION_REDFISH_DELAY_BUDGET_SEC: "90"              # max duration for Redfish delay test
  TYCHO_CALIBRATION_REDFISH_IDLE_ENABLE: "false"                 # measure Redfish idle baseline
  TYCHO_CALIBRATION_GPU_POLL_ENABLE: "false"                     # enable GPU poll-rate calibration
  TYCHO_CALIBRATION_GPU_POLL_BUDGET_SEC: "30"                   # max duration for GPU poll-rate probe
  TYCHO_CALIBRATION_GPU_DELAY_ENABLE: "false"                    # enable GPU delay measurement
  TYCHO_CALIBRATION_GPU_DELAY_BUDGET_SEC: "30"                  # max duration for GPU delay test
  TYCHO_CALIBRATION_GPU_IDLE_ENABLE: "false"                     # measure GPU idle baseline

  TYCHO_COLLECTOR_GPU_PREFER_DCGM: "false"
  TYCHO_COLLECTOR_GPU_ENABLE_PERPROCESS: "false"
  TYCHO_COLLECTOR_GPU_ENABL_MIGDISCOVERY: "false"

  # Optional analysis knobs you already wired
  TYCHO_ANALYSIS_TRIGGER: "timer" # "redfish" | "timer"
  TYCHO_ANALYSIS_EVERY_SEC: "15"
  TYCHO_ANALYSIS_DETECT_LONGEST_DELAY: "false"

canMount:
  usrSrc: true  # /usr/src may not available, ie GKE

service:
  annotations: {}
  type: ClusterIP
  port: 9102

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

serviceMonitor:
  enabled: true
  namespace: tycho 
  interval: 10s
  scrapeTimeout: 5s
  labels: {}
  attachMetadata:
    node: false
  relabelings:
    - action: replace
      regex: (.*)
      replacement: $1
      sourceLabels:
        - __meta_kubernetes_pod_node_name
      targetLabel: instance